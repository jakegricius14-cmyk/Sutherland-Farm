<style>
/* Concept: a pinned full-screen stage. Scrolling slides the product cards sideways along a gentle arc;
   hovering (or tapping) a card turns it around to show its details. */
:root{
  --cream:#f1e9db; --plum:#141211; --plum-2:#0a0909; --ember:#b98a55; --ember-soft:#d4a874;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Avenir Next','Helvetica Neue',Arial,sans-serif;
  --pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--plum);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--ember);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.label{font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;font-weight:500}

/* top bar */
.bar{position:fixed;inset:0 0 auto;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:20px 24px;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:var(--pill);background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--plum);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--plum)}
.pill i{width:9px;height:9px;background:var(--ember);transform:rotate(45deg);display:block}
.bar .logo{width:124px;height:124px;margin-top:-6px}
.bar .right{justify-self:end}
.bar .left{justify-self:start}
@media(max-width:620px){.bar{padding:14px 14px}.bar .left{display:none}.bar .logo{width:92px;height:92px;grid-column:2}.bar .right{grid-column:3;padding:0 14px;font-size:.68rem}}

/* pinned scroller: height is set by script (an endless, self-resetting scroll) */
.scroller{position:relative;height:400svh}
.stage{position:sticky;top:0;height:100svh;min-height:640px;overflow:hidden;background:var(--cream)}

.blob{position:absolute;left:50%;top:64%;width:min(1100px,130vw);aspect-ratio:1;background:var(--plum);border-radius:17%;transform:translateX(-50%) rotate(-7deg)}

/* cards */
.track{position:absolute;inset:0;z-index:10;pointer-events:none}
.card{--w:clamp(210px,23vw,330px);position:absolute;left:50%;top:18%;width:var(--w);aspect-ratio:3/4;margin-left:calc(var(--w)/-2);perspective:1100px;pointer-events:auto;will-change:transform;cursor:pointer;background:none;border:0;text-align:left;font:inherit;color:inherit}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 34px 50px -22px rgba(20,18,17,.55)}
.card.arch .face{border-radius:999px 999px 28px 28px}
.card.round .face{border-radius:28px}
.front img{width:100%;height:100%;object-fit:cover}
.front .chip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--cream);color:var(--plum);border-radius:var(--pill);padding:7px 16px;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;white-space:nowrap}
.back{transform:rotateY(180deg);background:var(--plum-2);color:var(--cream);display:grid;align-content:center;justify-items:center;text-align:center;padding:12% 11%;gap:12px}
.card.arch .back{padding-top:26%}
.back .label{color:var(--ember-soft)}
.back h3{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,2.5vw,2.3rem);line-height:1}
.back .price{font-family:var(--display);font-style:italic;font-size:clamp(2rem,3vw,2.8rem);color:var(--ember-soft);line-height:1}
.back p{font-size:.9rem;line-height:1.5;opacity:.88}
@media (hover:hover){.card:hover .inner{transform:rotateY(180deg)}}
.card:focus-visible .inner,.card.flipped .inner{transform:rotateY(180deg)}

/* floating bulb (card 1): shakes, sheds real shells, then drops a clove that bounces once and falls away */
.card.float .face{box-shadow:none;border-radius:0;overflow:visible;backface-visibility:visible}
.card.float .inner{transform:none!important}
.bob{position:absolute;inset:0;animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-6px) rotate(-1.2deg)}50%{transform:translateY(10px) rotate(1.2deg)}}
.bulb{position:absolute;inset:0;transform-origin:50% 88%}
.bulb .skin,.bulb .bare,.bulb .bare2{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;filter:drop-shadow(0 14px 18px rgba(20,18,17,.28))}
.bulb .bare,.bulb .bare2{opacity:0}
.bulb.taken .bare2{opacity:1}
.bulb .cl{position:absolute;height:auto;opacity:0;pointer-events:none;filter:drop-shadow(2px 5px 5px rgba(70,40,15,.42))}
.bulb.show .cl{opacity:1}
.bulb.show.taken .cl{opacity:0}
.bulb .skin{transition:opacity .35s linear}
.bulb.gone .skin{opacity:0}
.bulb.shaking{animation:shake .75s linear 1}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}8%{transform:translate(-6px,0) rotate(-2.6deg)}18%{transform:translate(6px,-2px) rotate(2.8deg)}28%{transform:translate(-7px,0) rotate(-3deg)}38%{transform:translate(7px,-2px) rotate(3deg)}48%{transform:translate(-6px,0) rotate(-2.6deg)}60%{transform:translate(5px,-1px) rotate(2.2deg)}72%{transform:translate(-4px,0) rotate(-1.6deg)}85%{transform:translate(3px,0) rotate(1deg)}}
.bulb{container-type:inline-size}
.bulb .fl{position:absolute;left:var(--x);top:var(--y);width:var(--w);opacity:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 3px 5px rgba(20,18,17,.26))}
.bulb .fl .hg{position:relative;width:100%;will-change:transform}
.bulb .fl img{display:block;width:100%;height:auto}
.bulb .fl .sd{position:absolute;inset:0;opacity:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;background:linear-gradient(var(--ga),rgba(74,40,22,.62) 0%,rgba(74,40,22,0) 52%,rgba(255,252,246,.5) 100%)}
.bulb.show .bare{opacity:1}
.shadow{position:absolute;left:18%;right:18%;bottom:-6%;height:8%;border-radius:50%;background:radial-gradient(ellipse,rgba(20,18,17,.45),transparent 70%);filter:blur(6px);animation:shadow 6s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scale(1.05);opacity:.85}50%{transform:scale(.8);opacity:.55}}
.clove{position:absolute;left:0;top:0;z-index:120;opacity:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 10px 10px rgba(20,18,17,.4))}
@keyframes land{0%{transform:translateY(0)}35%{transform:translateY(9px)}100%{transform:translateY(0)}}
.copy .name.land{animation:land .55s ease 1}
@media (prefers-reduced-motion:reduce){.bob,.shadow{animation:none!important}}

/* copy on the plum shape */
.copy{position:absolute;left:0;right:0;top:71%;z-index:5;text-align:center;color:var(--cream);padding:0 20px;pointer-events:none}
.copy .label{color:var(--ember-soft);display:block;margin-bottom:10px}
.copy .name{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,6vw,5rem);line-height:1;transition:opacity .25s}
.copy .name em{font-weight:500;color:var(--ember-soft)}
.copy .meta{margin-top:12px;font-size:.95rem;opacity:.85;transition:opacity .25s}
.copy.swap .name,.copy.swap .meta,.copy.swap .label{opacity:0}
.foot{position:absolute;bottom:20px;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:0 28px;color:var(--cream);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;pointer-events:none}
.foot .cue{position:absolute;left:0;right:0;text-align:center;transition:opacity .4s}
.foot .cue::after{content:"";display:block;width:1px;height:22px;background:var(--cream);margin:8px auto 0;animation:drop 1.8s ease-in-out infinite;transform-origin:top}
@keyframes drop{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
.foot .count,.foot .hint{background:var(--cream);color:var(--plum);box-shadow:inset 0 0 0 1.5px var(--plum);border-radius:var(--pill);padding:9px 16px;font-variant-numeric:tabular-nums}

@media(max-width:700px){
  .blob{top:60%;width:210vw}
  .card{--w:min(58vw,260px);top:16%}
  .copy{top:68%}
  .foot{padding:0 18px}
  .foot .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  const sc=document.getElementById('scroller'), cards=[...document.querySelectorAll('.card')], n=cards.length;
  const blob=document.getElementById('blob');

  const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

  const LAPS=40, SHIFT=n*10;

    setTimeout(()=>{const c=cards[i].dataset;cL.textContent=c.label;cN.innerHTML=c.name;cM.textContent=c.meta;copy.classList.remove('swap')},first?0:180);

      const a=Math.abs(d);

  /* ---- single bulb: shake, peel the skin off in real flakes that float around it, a clove tips out of the bulb and falls, bounces on the black shape and slides away, then the flakes fly home ---- */

  function drawPieces(u,shade){

      }else{                                                                            /* returning: back to the exact spot, one after another */

        spring(p,'lf','vlf',0,220,.9,dt); spring(p,'tw','vtw',0,220,.9,dt);
        if(Math.abs(p.x)>.08||Math.abs(p.y)>.08||Math.abs(p.r)>.4||Math.abs(p.lf)>.4||Math.abs(p.tw)>.4||Math.abs(p.s-1)>.003||Math.abs(p.vx)+Math.abs(p.vy)>.6) settled=false;

    cancelAnimationFrame(pRaf);

    drawPieces(1,false); drawSkin(); bulb.classList.remove('gone');   /* every flake is home: the full skin photo fades in under them (identical pixels), then they step aside */
    timers.push(setTimeout(()=>{ for(const p of pieces){p.on=0;p.el.style.opacity=''} bulb.classList.remove('show','taken'); mode='whole'; peeling=false },420));
  }
  function resetPeel(){
    peeling=false; mode='whole'; timers.forEach(clearTimeout); timers=[]; cancelAnimationFrame(cRaf); cancelAnimationFrame(pRaf);
    clearPieces(); drawSkin();

  }
  function playPeel(){
    if(mode!=='whole'||!centred()) return; peeling=true; mode='shaking';
    if(calm){bulb.classList.add('show','taken'); sctx.clearRect(0,0,CW,CH); mode='floating'; return}
    bulb.classList.add('shaking');

  }
  function assemble(){

  }

  /* the clove: it is the very clove that sits in the hole. It tips out of the bulb about its base, lets go, then falls as a rigid body: bounces on the tilted black shape, settles and slides off its edge */
  function dropClove(){
    if(mode!=='floating') return;
    const st=stage.getBoundingClientRect(), cl=bulb.querySelector('.cl'), cr=cl.getBoundingClientRect(), bb=bulb.getBoundingClientRect();
    const W=stage.clientWidth, H=stage.clientHeight, wr=bb.width*.384, hr=wr*738/417, w=wr, h=hr, ROFF=-4*D2R;   /* ONE clove: the same photo sits in the hole and then falls, so nothing can change shape */

    let x=cx0, y=cy0, ang=0, vx=0, vy=0, om=0, sc=1, bounced=false, free=false, last=performance.now(), start=last, px_=x, py_=y, pa_=0;

    function finish(){ clove.style.opacity=0; cloveB.style.opacity=0; timers.push(setTimeout(assemble,500)) }
    /* as it comes away the clove also turns about its own length: the face we saw in the bulb narrows to an edge, and the back of the clove (a real photo of a clove's other side) opens up. It is never a dissolve, only a turn */
    function place(el){
      const q=Math.min(1,Math.max(0,(el-T0)/DUR)), ph=Math.PI*(q*q*(3-2*q)), cs=Math.cos(ph), front=cs>0.035, back=cs<-0.035, w_=Math.max(.035,Math.abs(cs));
      const k=Math.min(1,el/700), sh=2*(1-k)+'px '+5*(1-k)+'px '+(5+4*k)+'px', br=(.68+.32*Math.pow(Math.abs(cs),.7)).toFixed(3);
      const f='brightness('+br+') drop-shadow('+sh+' rgba(60,35,15,'+(.42-.04*k).toFixed(2)+'))';
      const tr=(px,py,ww,hh)=>'translate('+(x-ww/2).toFixed(1)+'px,'+(y-hh/2).toFixed(1)+'px) rotate('+(ang/D2R).toFixed(2)+'deg) scale('+(sc*w_).toFixed(3)+','+sc.toFixed(3)+')';
      clove.style.transform=tr(0,0,wr,hr); clove.style.filter=f; clove.style.opacity=front?1:0;
      const wb=wr*.926; cloveB.style.transform=tr(0,0,wb,hr); cloveB.style.filter=f; cloveB.style.opacity=back?1:0;
    }
    function step(t){
      const dt=Math.min((t-last)/1000,.05); last=t; const el=t-start;
      if(el<P1){                                                            /* phase 1: graceful, slow, tips out about its base */
        const u=el/P1, e=u*u*(2.2-1.2*u), a=TILT*e*D2R; sc=1+.12*e;
        const rx=(cx0-pvx)*sc, ry=(cy0-pvy)*sc, c=Math.cos(a), s_=Math.sin(a);
        px_=x; py_=y; pa_=ang;
        x=pvx+rx*c-ry*s_; y=pvy+rx*s_+ry*c; ang=a;
        place(el); cRaf=requestAnimationFrame(step); return;
      }
      if(!free){free=true; const d0=Math.max(dt,.008); vx=(x-px_)/d0*.6+bb.width*.12; vy=(y-py_)/d0*.6-390; om=(ang-pa_)/d0*.6+.9}   /* it lets go */
      const n=6, h2=dt/n;
      for(let i=0;i<n;i++){
        vy+=G*h2; x+=vx*h2; y+=vy*h2; ang+=om*h2;
        const cs=Math.cos(ang), sn=Math.sin(ang);
        for(const c of circ){
          const lx=c.x*sc, ly=c.y*sc, px=x+lx*cs-ly*sn, py=y+lx*sn+ly*cs, s=sdf(px,py), pen=c.r*sc-s.d;
          if(pen<=0) continue;
          x+=s.nx*pen*.8; y+=s.ny*pen*.8;
          const rx=px-x, ry=py-y, vcx=vx-om*ry, vcy=vy+om*rx, vn=vcx*s.nx+vcy*s.ny;
          if(vn<0){
            const e=-vn<170?0:(bounced?E:E1), rn=rx*s.ny-ry*s.nx, jn=-(1+e)*vn/(1+rn*rn/I);
            vx+=jn*s.nx; vy+=jn*s.ny; om+=rn*jn/I;
            const tx=-s.ny, ty=s.nx, vt=vcx*tx+vcy*ty, rt=rx*ty-ry*tx, lim=MU*jn, jt=Math.max(-lim,Math.min(lim,-vt/(1+rt*rt/I)));
            vx+=jt*tx; vy+=jt*ty; om+=rt*jt/I;
            if(!bounced && -vn>230){bounced=true; cN.classList.remove('land'); void cN.offsetWidth; cN.classList.add('land')}
          }
        }
      }
      place(el);
      if(y-hr/2>H+80 || x+w<-60 || x-w>W+60 || el>15000){finish();return}
      cRaf=requestAnimationFrame(step);
    }
    cRaf=requestAnimationFrame(step);
  }
  bulbCard.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse') playPeel()});

  size();
  const startPos=LAPS/2*n;                   /* start in the middle, which is card 1 */
  scrollTo(0,startPos*step); cur=startPos;
  addEventListener('scroll',kick,{passive:true});
  addEventListener('resize',()=>{const p=mod(cur,n);size();scrollTo(0,(startPos+p)*step);cur=startPos+p;kick()});

  /* tap/click: a side card slides to the centre, the centred card turns over */
  cards.forEach((c,i)=>c.addEventListener('click',()=>{
    const d=mod(i-Math.round(cur)+n/2,n)-n/2;
    if(d!==0){scrollTo({top:scrollY+d*step,behavior:calm?'auto':'smooth'});return}
    if(c===bulbCard){ if(matchMedia('(hover:none)').matches) playPeel(); return }
    c.classList.toggle('flipped');
  }));
  addEventListener('scroll',()=>cards.forEach(c=>{ if(!c.matches(':hover')) c.classList.remove('flipped') }),{passive:true});

  frame();
})();
</script>
